        /* Particle Engine CSS */
        @keyframes fallAndSway {
            0% { transform: translateY(-50px) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(1200px) translateX(120px) rotate(360deg); opacity: 0; }

            position: absolute;
            pointer-events: none;
            z-index: 5;

    <script>
        // 1. Particle Engine (Canvas-Based)
        let particleCanvas, particleCtx, particles = [], animationId;
        
        function startParticles(themeKey) {
            particleCanvas = document.getElementById('particle-canvas');
            if (!particleCanvas) return;
            particleCtx = particleCanvas.getContext('2d');
            
            // Resize canvas to match container
            const rect = particleCanvas.getBoundingClientRect();
            particleCanvas.width = rect.width;
            particleCanvas.height = rect.height;

            cancelAnimationFrame(animationId);
            particles = [];
            
            const particleMaps = {
                "wonyoungism": ['🌸', '✨', '🎀', '🌸'], "y2k": ['🖤', '💖', '💿', '✨'], 
                "urban": ['💸', '🔥', '✨'], "techno": ['0', '1', '⚡', '💻'], "default": ['✨', '🫧', '🤍']
            };
            const emojis = particleMaps[themeKey] || particleMaps["default"];

            // Initialize 20 particles
            for (let i = 0; i < 20; i++) {
                particles.push(createParticle(emojis, particleCanvas.width, particleCanvas.height));
            }

            function createParticle(emojiList, w, h) {
                return {
                    x: Math.random() * w,
                    y: Math.random() * h - h,
                    vx: (Math.random() - 0.5) * 2,
                    vy: Math.random() * 2 + 2,
                    emoji: emojiList[Math.floor(Math.random() * emojiList.length)],
                    size: Math.random() * 20 + 20,
                    rotation: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 0.1
                };
            }

            const bgImg = new Image();
            bgImg.crossOrigin = "anonymous";
            bgImg.src = document.getElementById('xhs-bg-image').value;

            function animate() {
                particleCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
                
                // Draw background if loaded
                if (bgImg.complete && bgImg.naturalWidth > 0) {
                    const canvasAspect = particleCanvas.width / particleCanvas.height;
                    const imgAspect = bgImg.width / bgImg.height;
                    let drawW, drawH, drawX, drawY;

                    if (imgAspect > canvasAspect) {
                        drawH = particleCanvas.height;
                        drawW = drawH * imgAspect;
                        drawX = (particleCanvas.width - drawW) / 2;
                        drawY = 0;
                    } else {
                        drawW = particleCanvas.width;
                        drawH = drawW / imgAspect;
                        drawX = 0;
                        drawY = (particleCanvas.height - drawH) / 2;
                    }
                    particleCtx.drawImage(bgImg, drawX, drawY, drawW, drawH);
                }
                
                particleCtx.textAlign = 'center';
                particleCtx.textBaseline = 'middle';

                particles.forEach(p => {
                    p.y += p.vy;
                    p.x += p.vx;
                    p.rotation += p.vRot;
                    
                    if (p.y > particleCanvas.height + 50) {
                        p.y = -50;
                        p.x = Math.random() * particleCanvas.width;
                    }

                    particleCtx.save();
                    particleCtx.translate(p.x, p.y);
                    particleCtx.rotate(p.rotation);
                    particleCtx.font = `${p.size}px serif`;
                    particleCtx.fillText(p.emoji, 0, 0);
                    particleCtx.restore();
                });

                animationId = requestAnimationFrame(animate);
            }
            animate();
        }

        // 2. AI Image Shuffle
        async function shuffleXhsBg(customPrompt = null) {
            const bgInput = document.getElementById('xhs-bg-image');
            const theme = document.getElementById('xhs-theme-selector').value || "techno";
            const btn = document.getElementById('shuffle-btn');
            
            const themePrompts = {
                "techno": "CGI masterpiece, 3D modeling, liquid chrome metal, glowing neon green wires",
                "wonyoungism": "CGI masterpiece, 3D floating glossy pink bubbles, soft silk waving",
                "solidcore": "CGI masterpiece, 3D abstract metallic liquid, dramatic red neon",
                "urban": "CGI 3D brutalist concrete, floating silver typography, fisheye",
                "salon": "3D white marble minimalist sculpture, soft shadows",
                "bottari": "3D floating wood textures, amber glass perfume bottle",
                "nomad": "3D topographical map desert dunes, cinematic lighting",
                "algorithm": "3D holographic data nodes, glowing blue glass cubes",
                "y2k": "3D liquid metal shapes, chrome hearts, retro CGI 2000s",
                "posh": "3D soft fabric simulation, floating white drapery, studio lighting"
            };

            const seed = Math.floor(Math.random() * 9999999);
            const prompt = customPrompt || themePrompts[theme] || themePrompts["techno"];
            const finalPrompt = encodeURIComponent(prompt + ", empty background, no text, clean space");
            
            bgInput.value = `https://image.pollinations.ai/prompt/${finalPrompt}?width=1000&height=1400&nologo=true&seed=${seed}&t=${Date.now()}`;
            
            if (btn) {
                const orig = btn.innerText;
                btn.innerText = "✨ AI 绘图中...";
                setTimeout(() => btn.innerText = orig, 1500);
            }
            // Trigger Live Preview
            renderPreview();
        }

        // 3. Live Preview Engine (Upgraded with Content Hierarchy & Universal 3D)
        function renderPreview() {
            const title = document.getElementById('xhs-title').value || "视觉中心";
            const hook = document.getElementById('xhs-hook').value || "深度专访 // 独家揭秘";
            const bodyText = document.getElementById('xhs-body').value || "探索全新美学体系。\\nXYLAB 第一辑。";
            const endingText = document.getElementById('xhs-ending').value || "";
            const fullBody = endingText ? `${bodyText}\\n\\n${endingText}` : bodyText;
            const body = fullBody.replace(/\\n/g, '<br>');
            const bgImageUrl = document.getElementById('xhs-bg-image').value.trim();
            const themeKey = document.getElementById('xhs-theme-selector').value || "techno";
            const canvasDiv = document.getElementById('xhs-canvas');

            const btn = document.getElementById('generate-xhs-btn');
            if(btn && btn.innerText.includes("长按静态图")) {
                btn.innerText = "🚀 Generate Poster";
            }

            const themes = {
                "techno": { masthead: "font-mono text-[#00FF41]", text: "text-white", overlay: "from-black/95 via-black/40 to-black/95", accent: "border-[#00FF41]" },
                "wonyoungism": { masthead: "font-serif text-[#FF1493]", text: "text-white", overlay: "from-pink-900/60 via-transparent to-pink-900/80", accent: "border-[#FF69B4]" },
                "solidcore": { masthead: "font-black italic text-red-600", text: "text-white", overlay: "from-black/90 via-black/20 to-black/95", accent: "border-red-600" },
                "urban": { masthead: "font-black uppercase text-white drop-shadow-[4px_4px_0_#FF00FF]", text: "text-white", overlay: "from-gray-900/80 via-gray-900/30 to-black", accent: "border-[#FF00FF]" },
                "salon": { masthead: "font-serif font-light tracking-[0.2em] text-[#F5F5F0]", text: "text-[#F5F5F0]", overlay: "from-[#2C2C2C]/80 via-[#2C2C2C]/30 to-[#1A1A1A]/95", accent: "border-[#DCDCDC]" },
                "bottari": { masthead: "font-serif text-[#EAE4D9]", text: "text-[#EAE4D9]", overlay: "from-[#5C4A3D]/80 via-[#5C4A3D]/20 to-[#3E2F21]/95", accent: "border-[#CBBFAB]" },
                "nomad": { masthead: "font-sans font-black text-orange-200 uppercase", text: "text-white", overlay: "from-orange-900/80 via-transparent to-black/95", accent: "border-orange-400" },
                "algorithm": { masthead: "font-mono font-bold text-blue-200 underline decoration-wavy", text: "text-white", overlay: "from-blue-900/80 via-blue-900/20 to-blue-950/95", accent: "border-blue-400" },
                "y2k": { masthead: "font-black text-yellow-300 drop-shadow-[3px_3px_0_#FF00FF]", text: "text-white", overlay: "from-purple-900/60 via-purple-900/20 to-indigo-900/95", accent: "border-yellow-300" },
                "posh": { masthead: "font-serif italic text-white", text: "text-white", overlay: "from-black/50 via-transparent to-black/90", accent: "border-white" }
            };

            const style = themes[themeKey] || themes["techno"];
            const layoutModeElement = document.querySelector('input[name="layout_mode"]:checked');
            const layoutMode = layoutModeElement ? layoutModeElement.value : 'cover';

            // Universal 3D Background for BOTH modes
            const bgStyle = bgImageUrl ? `background-image: url('${bgImageUrl}'); background-size: cover; background-position: center;` : `background: #121212;`;

            if (layoutMode === 'cover') {
                // COVER MODE: Only Title and Hook. High visual impact.
                canvasDiv.innerHTML = `
                    <div id="xhs-canvas-content" class="relative h-full w-full flex flex-col overflow-hidden rounded-md" style="${bgStyle}">
                        <div class="absolute inset-0 bg-gradient-to-b ${style.overlay} z-0"></div>
                        <canvas id="particle-canvas" class="absolute inset-0 overflow-hidden pointer-events-none z-0 w-full h-full"></canvas>
                        
                        <div class="relative z-10 flex flex-col h-full p-8 pr-20 ${style.text}">
                            <div class="flex justify-between items-center text-[10px] font-mono tracking-widest uppercase mb-4 opacity-80 border-b border-current pb-2">
                                <span>XYLAB // ISSUE NO.01</span><span class="bg-rose-500 text-white px-2 py-0.5 rounded-sm font-black italic tracking-tighter">XYLab's CHOICE</span>
                            </div>
                            
                            <!-- Theme Name Hidden at User Request -->
                            <div class="mt-2 mb-auto"></div>
                            
                            <div class="mt-auto mb-10 w-[96%] relative">
                                <div class="absolute inset-0 bg-gradient-to-br from-white/30 to-white/5 border border-white/50 rounded-2xl shadow-[0_25px_50px_-12px_rgba(0,0,0,0.8)] z-0"></div>
                                <div class="relative z-10 p-6 backdrop-filter-none">
                                    <div class="text-xs font-bold uppercase tracking-widest mb-3 py-1 border-l-4 pl-3 ${style.accent} drop-shadow-lg">${hook}</div>
                                    <h2 class="text-4xl font-black leading-tight mb-2 drop-shadow-[0_5px_5px_rgba(0,0,0,0.9)]">${title}</h2>
                                    </div>
                            </div>
                        </div>
                    </div>`;
            } else {
                // INNER MODE: Hook, Title, and Full Body. Includes 3D Background with glassmorphism overlay.
                canvasDiv.innerHTML = `
                    <div id="xhs-canvas-content" class="relative h-full w-full flex flex-col overflow-hidden rounded-md border-4 border-black/10" style="${bgStyle}">
                        <div class="absolute inset-0 bg-black/50 backdrop-blur-md z-0"></div>
                        <div class="absolute inset-0 bg-gradient-to-b ${style.overlay} z-0 opacity-90"></div>
                        <canvas id="particle-canvas" class="absolute inset-0 overflow-hidden pointer-events-none z-0 w-full h-full opacity-50"></canvas>
                        
                        <div class="relative z-10 h-full w-full flex flex-col p-8 pr-12 ${style.text}">
                            <div class="flex justify-between items-center border-b border-white/20 pb-4 mb-6 opacity-80">
                                <span class="font-bold tracking-widest uppercase text-[10px]">${hook}</span>
                                <span class="font-mono text-[8px] bg-white/20 px-2 py-1 rounded">PAGE 02 // XYLAB</span>
                            </div>
                            
                            <h2 class="text-2xl font-black leading-snug mb-6 opacity-95 tracking-tight drop-shadow-md border-l-4 pl-3 ${style.accent}">${title}</h2>
                            
                            <div class="flex-grow text-xs leading-[2.2] font-medium opacity-90 whitespace-pre-line text-justify overflow-y-auto pr-2 drop-shadow-sm">
                                ${body}
                            </div>
                        </div>
                    </div>`;
            }

            // Universally start particles for BOTH modes
            startParticles(themeKey);
        }

        // 4. Record Live Video
        async function recordLiveVideo() {
            const canvas = document.getElementById('particle-canvas');
            if (!canvas) { alert("Only 'Cover' layout supports Live Photo export!"); return; }
            
            const recordBtn = document.getElementById('record-live-btn');
            const stream = canvas.captureStream(30); // 30 FPS
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
            const chunks = [];

            recorder.ondataavailable = (e) => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `XYLAB_Live_${Date.now()}.webm`;
                a.click();
                recordBtn.innerText = "🎬 Record Live Photo";
                recordBtn.disabled = false;
                recordBtn.classList.remove('opacity-50');
            };

            recordBtn.innerText = "⏺️ Recording (3s)...";
            recordBtn.disabled = true;
            recordBtn.classList.add('opacity-50');
            
            recorder.start();
            setTimeout(() => recorder.stop(), 3000);
        }

        // 5. Capture Engine (Static PNG)
        async function generatePoster() {
            const canvasDiv = document.getElementById('xhs-canvas');
            const btn = document.getElementById('generate-xhs-btn');

            if(canvasDiv.innerHTML.includes('<img')) {
                alert("The canvas is already a static image. Edit the text on the left to revert to Live Mode!");
                return;
            }

            btn.innerText = "⏳ Capturing...";
            btn.disabled = true;
            btn.classList.add('opacity-50');
            
            try {
                if(typeof particleEmitterInterval !== 'undefined') clearInterval(particleEmitterInterval);
                await new Promise(r => setTimeout(r, 400)); 
                const canvas = await html2canvas(canvasDiv, { scale: 3, useCORS: true, backgroundColor: null });
                canvasDiv.innerHTML = `<img src="${canvas.toDataURL("image/png")}" class="w-full h-full object-cover shadow-2xl rounded-md" />`;
                btn.innerText = "✅ Long Press to Save";
            } catch (error) {
                btn.innerText = "❌ Capture Failed";
                console.error(error);
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }

        // 5. Magic AI Brain (Vision Enhanced)
        let uploadedImageBase64 = "";

        function handleVisionUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImageBase64 = e.target.result;
                // 1. Instantly set it as the background image input
                document.getElementById('xhs-bg-image').value = uploadedImageBase64;
                // 2. Trigger the live preview so the user sees their photo in the magazine layout
                renderPreview();
                
                // CRITICAL FIX: Clear the file input so the same image can be uploaded again
                event.target.value = '';
            };
            reader.readAsDataURL(file);
        }

        async function generateMagicPost() {
            const promptText = document.getElementById('magic-prompt').value;
            const btn = document.getElementById('magic-btn');
            
            if (!promptText && !uploadedImageBase64) { 
                alert("主编大人，请上传图片或输入灵感！"); 
                return; 
            }
            
            btn.innerText = "👁️ AI 正在识别原图并爆肝写稿...";
            btn.disabled = true;
            btn.classList.add('animate-pulse');

            try {
                const res = await fetch('/api/vision-magic', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText, image: uploadedImageBase64 })
                });
                
                if (!res.ok) throw new Error("API 请求失败");
                const magicData = await res.json();
                
                if (magicData && magicData.copy) {
                    document.getElementById('xhs-title').value = magicData.copy.title || "";
                    document.getElementById('xhs-hook').value = magicData.copy.hook || "";
                    document.getElementById('xhs-body').value = magicData.copy.body || "";
                    document.getElementById('xhs-ending').value = magicData.copy.ending || "";
                }
                
                if (magicData && magicData.visual) {
                    document.getElementById('xhs-theme-selector').value = magicData.visual.theme || "posh";
                    const layoutRadio = document.querySelector(`input[name="layout_mode"][value="${magicData.visual.layout || 'cover'}"]`);
                    if(layoutRadio) layoutRadio.checked = true;
                    
                    // Note: We DO NOT call shuffleXhsBg() because we want to keep the user's uploaded image.
                    renderPreview();
                }

            } catch (error) {
                console.error("Vision Magic API Error:", error);
                alert("生成失败！请检查后端是否开启。");
            } finally {
                btn.innerText = "🚀 AI 识图与自动排版";
                btn.disabled = false;
                btn.classList.remove('animate-pulse');
            }
        }

        // 6. Event Listeners & Live Binding
        let debounceXhs;
        function triggerDebounceRender() {
            clearTimeout(debounceXhs);
            debounceXhs = setTimeout(renderPreview, 300);
        }

        document.getElementById('xhs-title').addEventListener('input', triggerDebounceRender);
        document.getElementById('xhs-hook').addEventListener('input', triggerDebounceRender);
        document.getElementById('xhs-body').addEventListener('input', triggerDebounceRender);
        document.getElementById('xhs-ending').addEventListener('input', triggerDebounceRender);
        document.getElementById('xhs-bg-image').addEventListener('input', triggerDebounceRender);
        document.getElementById('xhs-theme-selector').addEventListener('change', renderPreview);
        document.querySelectorAll('input[name="layout_mode"]').forEach(radio => {
            radio.addEventListener('change', renderPreview);
        });

        // Initial render on load
        document.addEventListener("DOMContentLoaded", renderPreview);
    </script>
</body>
</html>
