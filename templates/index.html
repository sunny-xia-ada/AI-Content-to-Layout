<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>XYLAB // SMART AGENT v3.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #FDFDFD;
            color: #1A1A1A;
            -webkit-tap-highlight-color: transparent;
        }

        .serif {
            font-family: 'Cormorant Garamond', serif;
        }

        .chic-shadow {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.03);
        }

        .pink-gradient {
            background: linear-gradient(135deg, #FFF5F7 0%, #FFF 100%);
        }

        .loopy-btn {
            background: #FEC5D2;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .loopy-btn:active {
            transform: scale(0.95);
            opacity: 0.9;
        }

        .tab-active {
            color: #1A1A1A;
            border-bottom: 2px solid #1A1A1A;
        }

        .tab-inactive {
            color: #A0A0A0;
        }

        /* Mobile Sticky Footer */
        @media (max-width: 768px) {
            .mobile-height {
                height: calc(100vh - 120px);
            }

            .sticky-footer {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                padding: 20px;
                background: rgba(255, 255, 255, 0.8);
                backdrop-filter: blur(20px);
                border-top: 1px solid rgba(0, 0, 0, 0.05);
                z-index: 100;
            }
        }

        textarea:focus {
            outline: none;
        }

        ::-webkit-scrollbar {
            width: 0px;
        }

        #preview {
            transition: opacity 0.3s ease;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav
        class="h-16 flex items-center justify-between px-6 border-b border-black/5 bg-white/80 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <span class="serif text-xl tracking-tighter uppercase font-bold text-black">XYLAB <span
                    class="text-xs font-light opacity-30 italic ml-1">SMART AGENT v3.3</span></span>
        </div>
        <img src="{{ loopy_uri }}" class="w-8 h-8 rounded-full border border-pink-100" alt="loopy">
    </nav>

    <!-- Mobile Tabs (Visible on Mobile) -->
    <div class="flex md:hidden bg-white border-b border-black/5 items-center justify-around h-12">
        <button id="tab-edit"
            class="h-full px-8 text-xs font-bold uppercase tracking-widest tab-active">Manuscript</button>
        <button id="tab-preview" class="h-full px-8 text-xs font-bold uppercase tracking-widest tab-inactive">Aura
            View</button>
    </div>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden bg-[#F9F9F9]">

        <!-- Editor Section -->
        <section id="section-edit" class="flex-1 p-4 md:p-10 flex flex-col">
            <div class="bg-white rounded-3xl chic-shadow flex-1 flex flex-col overflow-hidden border border-black/5">
                <div class="px-6 py-4 border-b border-black/5 flex justify-between items-center">
                    <span class="text-[10px] uppercase tracking-[0.2em] font-bold opacity-30">Editor</span>
                    <div class="flex items-center space-x-4">
                        <button id="ai-btn" class="text-[10px] uppercase font-bold bg-[#FEC5D2] text-[#E91E63] px-3 py-1 rounded shadow-sm hover:scale-105 transition-transform duration-300">AI Auto-Layout</button>
                        <button type="button" id="shuffle-btn" onclick="shuffleImage()" class="text-[10px] uppercase font-bold bg-gray-200 text-gray-700 px-3 py-1 rounded shadow-sm hover:scale-105 transition-transform duration-300">🎲 Shuffle</button>
                        <select name="theme" id="theme-selector" class="text-[10px] uppercase tracking-[0.2em] font-bold opacity-50 bg-transparent outline-none cursor-pointer">
                            <option value="loopy">Loopy Cute</option>
                            <option value="executive">Executive Gray</option>
                            <option value="ethereal">Ethereal Sky</option>
                            <option value="techno">Techno Cyber</option>
                            <option value="urban">Urban Pulse</option>
                            <option value="wonyoung">Wonyoungism</option>
                            <option value="algorithm">Algorithm Art</option>
                            <option value="archive">Archive 2026</option>
                            <option value="solidcore">Solidcore</option>
                            <option value="bottari">Bottari</option>
                        </select>
                        <div class="w-1.5 h-1.5 rounded-full bg-green-400"></div>
                    </div>
                </div>
                <textarea id="editor"
                    class="flex-1 p-6 text-sm leading-relaxed text-black/70 resize-none font-serif italic"
                    placeholder="Type your story here..."></textarea>
            </div>
            <!-- Padding for sticky footer on mobile -->
            <div class="h-24 md:hidden"></div>
        </section>

        <!-- Preview Section -->
        <section id="section-preview" class="flex-1 p-4 md:p-10 flex flex-col md:flex hidden">
            <div class="flex flex-col items-center justify-center h-full">
                <div class="hidden md:flex text-[10px] uppercase tracking-[0.3em] font-bold opacity-30 mb-6">Mobile
                    Preview (375px)</div>

                <div
                    class="w-full max-w-[375px] h-[667px] md:h-[700px] bg-white rounded-[40px] chic-shadow overflow-hidden border border-black/5 relative">
                    <div id="preview" class="h-full overflow-y-auto overflow-x-hidden scroll-smooth bg-[#F8F8F8]">
                        <div
                            class="flex flex-col items-center justify-center h-full text-black/10 serif uppercase italic tracking-widest text-sm p-10 text-center">
                            Write something to see the aura...
                        </div>
                    </div>
                </div>
            </div>
            <!-- Padding for sticky footer on mobile -->
            <div class="h-24 md:hidden"></div>
        </section>
    </main>

    <!-- Sticky Footer Copy Button -->
    <div class="sticky-footer md:fixed md:bottom-10 md:right-10 md:bg-transparent md:border-none">
        <button id="copy-btn"
            class="loopy-btn w-full md:w-auto md:px-12 py-4 rounded-2xl md:rounded-full text-white font-bold uppercase tracking-[0.2em] text-sm shadow-xl shadow-pink-200">
            Copy for WeChat
        </button>
    </div>

    <!-- Toast Notification -->
    <div id="toast"
        class="fixed top-20 left-1/2 -translate-x-1/2 bg-black text-white px-8 py-3 rounded-full text-[10px] uppercase tracking-widest font-bold opacity-0 transition-all duration-500 z-[200]">
        Aura Copied to Clipboard
    </div>

    <script>
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const copyBtn = document.getElementById('copy-btn');
        const tabEdit = document.getElementById('tab-edit');
        const tabPreview = document.getElementById('tab-preview');
        const sectionEdit = document.getElementById('section-edit');
        const sectionPreview = document.getElementById('section-preview');
        const toast = document.getElementById('toast');
        const aiBtn = document.getElementById('ai-btn');

        // Tab Switching
        tabEdit.addEventListener('click', () => {
            tabEdit.classList.replace('tab-inactive', 'tab-active');
            tabPreview.classList.replace('tab-active', 'tab-inactive');
            sectionEdit.classList.remove('hidden');
            sectionPreview.classList.add('hidden');
        });

        tabPreview.addEventListener('click', () => {
            tabPreview.classList.replace('tab-inactive', 'tab-active');
            tabEdit.classList.replace('tab-active', 'tab-inactive');
            sectionPreview.classList.remove('hidden', 'md:flex');
            sectionPreview.classList.add('flex');
            sectionEdit.classList.add('hidden');
        });

        // Conversion Logic
        let debounce;
        // Refactored Preview Function for Immediate Callback
        async function updatePreview() {
            const text = editor.value;
            if (!text.trim()) {
                preview.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-black/10 serif uppercase italic tracking-widest text-sm p-10 text-center">Write something to see the aura...</div>`;
                preview.style.opacity = 1;
                return;
            }
            
            preview.style.opacity = 0;
            
            const theme = document.getElementById('theme-selector').value;
            try {
                const res = await fetch('/convert', {
                    method: 'POST',
                    body: new URLSearchParams({ markdown_input: text, theme: theme })
                });
                const data = await res.json();
                preview.innerHTML = data.html;
            } catch(e) { console.error(e); }
            
            setTimeout(() => {
                preview.style.opacity = 1;
            }, 50);
        }

        editor.addEventListener('input', () => {
            clearTimeout(debounce);
            debounce = setTimeout(updatePreview, 300);
        });

        document.getElementById('theme-selector').addEventListener('change', () => {
            updatePreview();
        });

        // AI Auto-Layout Logic
        aiBtn.addEventListener('click', async () => {
            const text = editor.value;
            if (!text.trim()) return;
            
            aiBtn.innerText = "Processing...";
            aiBtn.classList.add("opacity-50");
            
            const theme = document.getElementById('theme-selector').value;
            try {
                const res = await fetch('/ai-process', {
                    method: 'POST',
                    body: new URLSearchParams({ markdown_input: text, theme: theme })
                });
                const data = await res.json();
                // Strict Override
                editor.value = data.markdown;
                // Immediate View Refresh
                await updatePreview();
            } catch (err) {
                console.error(err);
            } finally {
                aiBtn.innerText = "AI Auto-Layout";
                aiBtn.classList.remove("opacity-50");
            }
        });

        // Shuffle Logic
        async function shuffleImage() {
            // 1. Get elements 
            const editor = document.getElementById('editor');
            const themeSelect = document.getElementById('theme-selector'); 
            const shuffleBtn = document.getElementById('shuffle-btn');
            
            if (!editor) { console.error("Could not find textarea!"); return; }

            const originalText = shuffleBtn.innerText;
            shuffleBtn.innerText = "🎲 Shuffling...";
            
            try {
                // 2. Fetch new image from backend
                const response = await fetch('/shuffle-image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ 'theme': themeSelect ? themeSelect.value : 'loopy' })
                });
                
                const data = await response.json();
                
                if (data.new_image_markdown) {
                    // 3. Bulletproof Regex: Target the Divider image specifically so we don't wipe the Hero
                    const imageRegex = /!\[Divider\]\(.*?\)/g; 
                    
                    if (imageRegex.test(editor.value)) {
                        editor.value = editor.value.replace(imageRegex, data.new_image_markdown);
                    } else {
                        // If somehow deleted, append to bottom
                        editor.value += "\n\n" + data.new_image_markdown + "\n\n";
                    }
                    
                    // 4. Force the preview to update! (Ensure this function exists)
                    if (typeof updatePreview === "function") {
                        updatePreview();
                    } else {
                        console.error("updatePreview() function is missing!");
                    }
                }
            } catch (error) {
                console.error("Shuffle API Error:", error);
                alert("Failed to shuffle image. Check console.");
            } finally {
                shuffleBtn.innerText = originalText;
            }
        }

        // Clipboard Copy
        copyBtn.addEventListener('click', async () => {
            const auraCard = document.getElementById('aura-card');
            if (!auraCard) return;

            const html = auraCard.outerHTML;
            try {
                await navigator.clipboard.writeText(html);
                showToast();
            } catch (err) {
                // Fallback for older mobile browsers
                const textArea = document.createElement("textarea");
                textArea.value = html;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showToast();
            }
        });

        function showToast() {
            toast.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => toast.classList.replace('opacity-100', 'opacity-0'), 2500);
        }
    </script>
</body>

</html>
