<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XYLAB // YOUTUBE STUDIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background: #FDFDFD; }</style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="h-16 flex items-center justify-between px-6 border-b border-black/5 bg-white/80 sticky top-0 z-50">
        <div class="flex items-center space-x-4">
            <a href="/" class="text-xs font-bold bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded-full transition-all">← XYLAB OS</a>
            <span class="text-xl tracking-tighter uppercase font-bold text-black">YOUTUBE <span class="text-xs font-light opacity-30 italic ml-1">STUDIO ENGINE</span></span>
        </div>
        <div class="w-3 h-3 rounded-full bg-red-600 animate-pulse"></div>
    </nav>
    <main class="flex-1 flex p-10 gap-6 bg-[#F9F9F9]">
        <section class="flex-1 bg-white rounded-3xl shadow-sm border border-black/5 p-8 flex flex-col">
            <h2 class="text-[10px] uppercase tracking-widest font-bold opacity-40 mb-6 border-b pb-2 text-red-600 border-red-100">Video Script & Storyboard</h2>
            <input type="text" class="text-3xl font-black border-b border-black/5 pb-2 mb-6 outline-none" placeholder="Video Title / Hook...">
            <div class="flex-1 flex flex-col space-y-4">
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 h-32 flex items-center justify-center text-gray-400 text-sm italic">
                    [00:00 - 00:05] Hook / Intro B-Roll
                </div>
                <textarea class="flex-1 w-full bg-gray-50 rounded-xl p-6 outline-none resize-none" placeholder="Main script and talking points..."></textarea>
            </div>
            <button class="mt-6 w-full py-4 bg-[#FF0000] text-white font-black text-lg rounded-xl shadow-lg hover:shadow-xl transition-all">
                ▶ Generate Scene Prompts
            </button>
        </section>
        <section class="w-1/3 bg-white rounded-3xl shadow-sm border border-black/5 p-8 hidden md:flex flex-col items-center justify-center">
            <span class="text-6xl mb-4">🎥</span>
            <p class="text-xs font-bold uppercase tracking-widest text-gray-400 text-center">Video Generation AI<br>Coming Soon</p>
        </section>
    </main>
</body>
</html>
